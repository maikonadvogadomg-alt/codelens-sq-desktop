name: Build Desktop Apps

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: codelens-linux
            artifact-path: dist-electron/*.AppImage
          - os: windows-latest
            artifact-name: codelens-windows
            artifact-path: dist-electron/*.exe
          - os: macos-latest
            artifact-name: codelens-mac
            artifact-path: dist-electron/*.dmg
    
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build server (Node.js)
        run: npm run build:server
        env:
          NODE_ENV: production

      - name: Verify build files
        run: |
          echo "📁 Checking dist/ directory..."
          ls -lh dist/ || echo "❌ dist/ not found"
          echo ""
          echo "📁 Checking electron/ directory..."
          ls -lh electron/ || echo "❌ electron/ not found"
          echo ""
          echo "📁 Checking dist-server/ directory..."
          ls -lh dist-server/ || echo "❌ dist-server/ not found"
        shell: bash

      - name: Build Electron app
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      - name: Check build output
        run: |
          echo "✅ Build completed. Checking output..."
          if [ -d "dist-electron" ]; then
            echo "✅ dist-electron directory found"
            ls -lh dist-electron/
          else
            echo "❌ dist-electron not found!"
            exit 1
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact-path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
